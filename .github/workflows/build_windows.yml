name: Build Windows Plugin & Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20

      - name: Build VST3 and Standalone
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Inspect Built Artefacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/*_artefacts

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc installer/windows/installer.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Call-and-Response-MIDI-Windows-Setup
          path: dist/*.exe

      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Call-and-Response-MIDI-VST3-Windows
          path: build/CallAndResponseMIDI_artefacts/Release/VST3/
